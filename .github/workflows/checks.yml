name: Offline workflow checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/local-url.test.mjs
      - run: sh -n docs/resources/root_persistence.sh
      - run: git diff --check
